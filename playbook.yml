---
- name: Apply Local Environment Baseline
  hosts: local
  connection: local

  vars:
    welcome_message: "--- Managed by Ansible Baseline ---"

  tasks:
    - name: Ensure test directory exists in home folder
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/ansible_test"
        state: directory
        mode: '0755'

    - name: Create local welcome banner
      ansible.builtin.copy:
        content: "{{ welcome_message }}\n"
        dest: "{{ ansible_env.HOME }}/ansible_test/motd.txt"
        mode: '0644'